<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spatial AI Property Audit & 3D Reconstruction Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-blue));
      color: white;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sample-pill-group {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.2rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      gap: 0.2rem;
    }
    .sample-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sample-pill:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.08); }
    .sample-pill.active { background: var(--accent-indigo); color: white; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 1.25rem;
      padding: 1.25rem 2rem;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .panel-header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .viewport {
      flex: 1;
      min-height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1120;
      padding: 1rem;
      overflow: auto;
    }
    .viewport svg {
      width: 100%;
      height: auto;
      max-height: 560px;
      border-radius: 8px;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.02);
    }
    .tab {
      padding: 0.75rem 1.1rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.05);
    }

    .tab-content {
      padding: 1.25rem;
      flex: 1;
      overflow-y: auto;
      max-height: 620px;
    }

    /* Live Interactive Sandbox Controls */
    .sandbox-box {
      background: rgba(99, 102, 241, 0.07);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.25rem;
    }
    .sandbox-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #a5b4fc;
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .sandbox-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .ctrl-lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .ctrl-slider {
      width: 100%;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    /* Upload Dropzone */
    .upload-zone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 1.2rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 1.25rem;
    }
    .upload-zone:hover {
      border-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.05);
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
      transition: transform 0.1s ease;
    }
    .btn-action:hover { transform: translateY(-1px); }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin-bottom: 1rem;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 0.75rem;
      border-radius: 8px;
    }
    .metric-lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .metric-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-blue);
      font-family: 'JetBrains Mono', monospace;
    }
    .metric-ci {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .damage-card {
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 0.85rem;
      border-radius: 8px;
      margin-bottom: 0.65rem;
    }
    .damage-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-rose);
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }
    .damage-body {
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .scope-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .scope-table th {
      text-align: left;
      padding: 0.5rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
    }
    .scope-table td {
      padding: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .scope-total {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--accent-emerald);
      padding-top: 0.85rem;
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald); border: 1px solid var(--accent-emerald); }
    .badge-fail { background: rgba(244, 63, 94, 0.2); color: var(--accent-rose); border: 1px solid var(--accent-rose); }

    .tag-rule {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      font-family: 'JetBrains Mono', monospace;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-badge">PROPRIETARY VIO / PGO ENGINE</span>
      <h1 class="brand-title">Spatial AI Property Audit & Scoping Engine</h1>
    </div>

    <div class="top-actions">
      <!-- Quick Sample Loader -->
      <div class="sample-pill-group">
        <button class="sample-pill active" onclick="loadSample('lidar_living', this)">LiDAR Room (.PLY)</button>
        <button class="sample-pill" onclick="loadSample('lidar_bedroom', this)">Bedroom (.PLY)</button>
        <button class="sample-pill" onclick="loadSample('multi_room', this)">Multi-Room Apt</button>
        <button class="sample-pill" onclick="loadSample('photo_damage', this)">Photo CV</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Left: 2D/3D Floor Plan Viewport -->
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/><path d="M14 4v16"/><path d="M4 10h16"/></svg>
          Architectural Floor Plan Output (Polycam / Magicplan Schema)
        </span>
        <span id="driftBadge" class="badge badge-pass">PGO LOOP CLOSURE: ACTIVE</span>
      </div>
      <div class="viewport" id="svgViewport">
        <p style="color: var(--text-muted)">Loading vector plan...</p>
      </div>
    </section>

    <!-- Right: Property Telemetry & AI Inspection -->
    <section class="panel">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('tabSandbox', this)">Interactive Tester</div>
        <div class="tab" onclick="switchTab('tabSpatial', this)">Spatial Metrics</div>
        <div class="tab" onclick="switchTab('tabConcealed', this)">Concealed Flags</div>
        <div class="tab" onclick="switchTab('tabScope', this)">Restoration Scope</div>
        <div class="tab" onclick="switchTab('tabGates', this)">Benchmark Gates</div>
      </div>

      <div class="tab-content" id="tabContentArea">
        <!-- Injected via JavaScript -->
      </div>
    </section>
  </main>

  <script>
    let currentSample = "lidar_living";
    let planData = null;
    let benchData = null;
    let activeTab = "tabSandbox";

    // Sandbox state
    let sbWidth = 5.2;
    let sbLength = 4.3;
    let sbHeight = 2.7;
    let sbWaterHeight = 0.65;
    let sbHasDamage = true;

    async function init() {
      await loadSample('lidar_living', null);
      fetchBenchmark();
    }

    async function fetchBenchmark() {
      try {
        const res = await fetch('/api/benchmark');
        benchData = await res.json();
      } catch (err) { console.error(err); }
    }

    async function loadSample(sampleKey, btn) {
      if (btn) {
        document.querySelectorAll('.sample-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      currentSample = sampleKey;
      document.getElementById('svgViewport').innerHTML = '<p style="color: var(--text-muted)">Processing real 3D point cloud via RANSAC...</p>';

      const res = await fetch('/api/load-sample', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sample: sampleKey })
      });
      planData = await res.json();
      refreshSvg();
      renderCurrentTab();
    }

    async function refreshSvg() {
      const svgRes = await fetch('/api/plan/svg?t=' + Date.now());
      const svgText = await svgRes.text();
      document.getElementById('svgViewport').innerHTML = svgText;
    }

    async function runCustomSandbox() {
      document.getElementById('svgViewport').innerHTML = '<p style="color: var(--text-muted)">Synthesizing 3D points & computing RANSAC planes...</p>';
      const res = await fetch('/api/custom-sandbox', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          width_m: sbWidth,
          length_m: sbLength,
          height_m: sbHeight,
          water_height_aff: sbWaterHeight,
          has_damage: sbHasDamage
        })
      });
      planData = await res.json();
      refreshSvg();
      renderCurrentTab();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('svgViewport').innerHTML = `<p style="color: var(--text-muted)">Uploading & parsing ${file.name}...</p>`;
      const formData = new FormData();
      formData.append('file', file);
      formData.append('tier', file.name.endsWith('.ply') ? 'lidar' : 'photos');

      const res = await fetch('/api/upload-file', {
        method: 'POST',
        body: formData
      });
      planData = await res.json();
      refreshSvg();
      renderCurrentTab();
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      activeTab = tabId;
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const area = document.getElementById('tabContentArea');
      if (!planData) {
        area.innerHTML = "<p>Loading data...</p>";
        return;
      }

      if (activeTab === "tabSandbox") {
        area.innerHTML = `
          <!-- Sandbox Controls -->
          <div class="sandbox-box">
            <div class="sandbox-title">
              <span>LIVE ROOM SIMULATOR & PARAMETER TESTER</span>
              <span style="font-size:0.75rem; color:#818cf8;">Dynamic 3D Synthesis</span>
            </div>
            
            <div class="sandbox-row">
              <div class="ctrl-group">
                <div class="ctrl-lbl"><span>Width</span><span id="lblW">${sbWidth}m</span></div>
                <input type="range" class="ctrl-slider" min="3.0" max="7.5" step="0.1" value="${sbWidth}" oninput="sbWidth=parseFloat(this.value); document.getElementById('lblW').innerText=this.value+'m';">
              </div>
              <div class="ctrl-group">
                <div class="ctrl-lbl"><span>Length</span><span id="lblL">${sbLength}m</span></div>
                <input type="range" class="ctrl-slider" min="3.0" max="7.0" step="0.1" value="${sbLength}" oninput="sbLength=parseFloat(this.value); document.getElementById('lblL').innerText=this.value+'m';">
              </div>
            </div>

            <div class="sandbox-row">
              <div class="ctrl-group">
                <div class="ctrl-lbl"><span>Ceiling Height</span><span id="lblH">${sbHeight}m</span></div>
                <input type="range" class="ctrl-slider" min="2.3" max="3.5" step="0.05" value="${sbHeight}" oninput="sbHeight=parseFloat(this.value); document.getElementById('lblH').innerText=this.value+'m';">
              </div>
              <div class="ctrl-group">
                <div class="ctrl-lbl"><span>Water Stain Height AFF</span><span id="lblDmg">${sbWaterHeight}m</span></div>
                <input type="range" class="ctrl-slider" min="0.1" max="1.2" step="0.05" value="${sbWaterHeight}" oninput="sbWaterHeight=parseFloat(this.value); document.getElementById('lblDmg').innerText=this.value+'m';">
              </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.75rem;">
              <label style="font-size:0.78rem; display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                <input type="checkbox" ${sbHasDamage ? 'checked' : ''} onchange="sbHasDamage=this.checked;"> Stage Water Contamination
              </label>
              <button class="btn-action" onclick="runCustomSandbox()">Simulate & Process Live</button>
            </div>
          </div>

          <!-- File Upload Zone -->
          <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom:0.4rem; color:var(--accent-blue);"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <p style="font-size:0.85rem; font-weight:700;">Drop your own .PLY point cloud or photo here</p>
            <p style="font-size:0.72rem; color:var(--text-muted); margin-top:0.2rem;">Supports Record3D / Scaniverse / Polycam LiDAR exports (.ply, .obj) & photos (.jpg, .png)</p>
            <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(event)">
          </div>

          <div style="font-size:0.78rem; color:var(--text-muted); line-height:1.5;">
            <strong>Test Pipeline Autonomously:</strong><br>
            • Select any preset from top right (LiDAR .PLY, Bedroom .PLY, Multi-Room Apt, or Photo CV).<br>
            • Or tune the room dimensions and water stain height above to watch the building code rules trigger live!
          </div>
        `;
      } else if (activeTab === "tabSpatial") {
        let roomsHtml = planData.rooms.map(r => `
          <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--card-border); padding: 0.85rem; border-radius: 8px; margin-bottom: 0.75rem;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 0.4rem;">
              <strong style="color: var(--text-main); font-size: 0.95rem;">${r.name}</strong>
              <span style="color: var(--accent-blue); font-family: monospace; font-weight:700;">${r.floor_area_m2.val} m² (CI: ${r.floor_area_m2.ci_95[0]} - ${r.floor_area_m2.ci_95[1]})</span>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">
              Ceiling Height: <strong style="color: #f1f5f9;">${r.ceiling_height_m.val} m</strong> | Walls: ${r.walls.length} | Openings: ${r.walls.reduce((acc, w) => acc + (w.openings ? w.openings.length : 0), 0)}
            </div>
          </div>
        `).join('');

        area.innerHTML = `
          <div class="metric-grid">
            <div class="metric-card">
              <div class="metric-lbl">Total Footprint</div>
              <div class="metric-val">${planData.total_footprint_m2.val} m²</div>
              <div class="metric-ci">CI: [${planData.total_footprint_m2.ci_95[0]}, ${planData.total_footprint_m2.ci_95[1]}]</div>
            </div>
            <div class="metric-card">
              <div class="metric-lbl">Rooms Placed</div>
              <div class="metric-val">${planData.rooms.length}</div>
              <div class="metric-ci">Adjacency: Locked (0 Overlaps)</div>
            </div>
            <div class="metric-card">
              <div class="metric-lbl">Latency</div>
              <div class="metric-val">${planData.processing_time_seconds}s</div>
              <div class="metric-ci">Sub-second Processing</div>
            </div>
          </div>
          <h3 style="font-size: 0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.6rem;">Dimensioned Room Geometry</h3>
          ${roomsHtml}
        `;
      } else if (activeTab === "tabConcealed") {
        if (!planData.concealed_damage_flags || planData.concealed_damage_flags.length === 0) {
          area.innerHTML = `<p style="color: var(--text-muted); padding: 1rem;">No concealed damage flags triggered for this capture session.</p>`;
          return;
        }

        let flagsHtml = planData.concealed_damage_flags.map(f => `
          <div class="damage-card">
            <div class="damage-title">
              <span>${f.surface_id.toUpperCase()}</span>
              <span class="tag-rule">${f.rule_fired}</span>
            </div>
            <div class="damage-body">
              <p><strong>Trigger Evidence:</strong> ${f.trigger_evidence}</p>
              <p style="margin-top: 0.4rem; color: #fca5a5;"><strong>Required Remediation:</strong> ${f.recommended_action}</p>
            </div>
          </div>
        `).join('');

        area.innerHTML = `
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
            Concealed-damage rule engine evaluates structural shear, wall cavity moisture saturation, and electrical proximity rules:
          </p>
          ${flagsHtml}
        `;
      } else if (activeTab === "tabScope") {
        if (!planData.scope_line_items || planData.scope_line_items.length === 0) {
          area.innerHTML = `<p style="color: var(--text-muted); padding: 1rem;">No restoration line items required.</p>`;
          return;
        }

        let rows = planData.scope_line_items.map(s => `
          <tr>
            <td><span class="tag-rule" style="font-size:0.7rem;">${s.code}</span></td>
            <td>${s.description}</td>
            <td style="font-family: monospace;">${s.quantity} ${s.unit}</td>
            <td style="font-family: monospace;">$${s.estimated_unit_cost.toFixed(2)}</td>
            <td style="font-family: monospace; font-weight:700;">$${s.total_cost.toFixed(2)}</td>
          </tr>
        `).join('');

        area.innerHTML = `
          <table class="scope-table">
            <thead>
              <tr>
                <th>Code</th>
                <th>Description</th>
                <th>Qty</th>
                <th>Unit Rate</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="scope-total">
            Total Estimated Restoration Cost: $${planData.total_estimated_restoration_cost.toLocaleString('en-US', {minimumFractionDigits: 2})}
          </div>
        `;
      } else if (activeTab === "tabGates") {
        if (!benchData) {
          area.innerHTML = `<p style="color:var(--text-muted);">Loading benchmark results...</p>`;
          return;
        }

        const lidar = benchData.lidar;
        const rep = benchData.repeatability;
        const vid = benchData.video;
        const pho = benchData.photos;

        area.innerHTML = `
          <div style="font-size: 0.85rem; line-height: 1.6;">
            <div style="display:flex; justify-content:space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--card-border);">

            <div style="display:flex; justify-content:space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--card-border);">

            <div style="display:flex; justify-content:space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--card-border);">

              <span class="badge badge-pass">Overlaps: ${pho.overlaps_detected} | FP Err: ${pho.footprint_error_pct}% (${pho.gates.photo_stitch_overlap_gate})</span>
            </div>
            <div style="display:flex; justify-content:space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--card-border);">
              <span><strong>6. Drift Correction Ablation:</strong> Loop Error Elimination</span>

            <div style="display:flex; justify-content:space-between; padding: 0.5rem 0;">

          </div>
        `;
      }
    }

    init();
  </script>
